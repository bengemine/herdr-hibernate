id = "bengemine.hibernate"
name = "Herdr Hibernate"
version = "1.5.0"
min_herdr_version = "0.7.0"
description = "Hibernate idle coding-agent panes (Claude Code, Codex, Grok, Droid, pi, opencode, cursor-agent, Devin, Amp) to ~0 RAM — kill the process tree, leave a tiny resume stub, press Enter to get the exact session back."
# Tested on Linux and WSL2. macOS uses the same nohup watcher fallback as
# WSL2 (no systemd); pid/uptime checks are /proc-free as of 1.5.0.
platforms = ["linux", "macos"]

# Everything is one dependency-free Python 3 script; there is no build step.
# State and config live in ~/.config/herdr-hibernate/ (not the plugin dirs) on
# purpose: the watcher also runs outside Herdr-injected environments (systemd
# unit, .bashrc stub hook), and all paths must agree on one location.

[[actions]]
id = "status"
title = "Hibernate: status table"
contexts = ["workspace"]
command = ["./herdr-hibernate", "status"]

[[actions]]
id = "scan"
title = "Hibernate: scan once"
contexts = ["workspace"]
command = ["./herdr-hibernate", "scan"]

[[actions]]
id = "now"
title = "Hibernate focused pane now"
contexts = ["pane", "workspace"]
command = ["./herdr-hibernate", "now"]

[[actions]]
id = "view"
title = "Hibernate: cycle agents list (all / running / hibernated)"
contexts = ["workspace"]
command = ["./herdr-hibernate", "view"]

[[actions]]
id = "keep"
title = "Hibernate: keep focused chat (never auto-settle) on/off"
contexts = ["pane", "workspace"]
command = ["./herdr-hibernate", "keep"]

[[actions]]
id = "restore"
title = "Hibernate: re-arm stubs"
contexts = ["workspace"]
command = ["./herdr-hibernate", "restore"]

[[actions]]
id = "install"
title = "Hibernate: install watcher + shell hook"
contexts = ["workspace"]
command = ["./herdr-hibernate", "install"]

[[actions]]
id = "uninstall"
title = "Hibernate: remove watcher + shell hook"
contexts = ["workspace"]
command = ["./herdr-hibernate", "uninstall"]

[[actions]]
id = "update"
title = "Hibernate: update plugin"
contexts = ["workspace"]
command = ["./herdr-hibernate", "update"]

# Closing a tab, pane or workspace moves its chats to the settled list, which
# `herdr-hibernate settled` shows (bind it to a popup key, see README).
[[events]]
on = "tab.closed"
command = ["./herdr-hibernate", "on-close"]

[[events]]
on = "pane.closed"
command = ["./herdr-hibernate", "on-close"]

[[events]]
on = "workspace.closed"
command = ["./herdr-hibernate", "on-close"]

# A close event names only the tab, so each live chat is noted beforehand.
[[events]]
on = "pane.agent_status_changed"
command = ["./herdr-hibernate", "remember"]
